<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lamp Login Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="room" id="room">
    <div class="room-light" id="roomLight"></div>
    <div class="fireflies" id="fireflies"></div>

    <!-- Lamp -->
    <div class="lamp-wrap">
      <div class="lamp" id="lamp">
        <div class="lamp-shade"></div>
        <div class="lamp-bulb"></div>
        <div class="lamp-pole"></div>
        <div class="lamp-base"></div>
        <button class="lamp-cord" id="cord" aria-label="Pull the cord to turn the lamp on or off">
          <span class="cord-line"></span>
          <span class="cord-knob"></span>
        </button>
        <div class="light-cone"></div>
      </div>
    </div>

    <!-- Login card -->
    <main class="card" id="card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Enter your details to access your account</p>

      <form id="loginForm">
        <div class="field">
          <i class="ri-user-line"></i>
          <input type="text" placeholder="Username" required>
        </div>
        <div class="field">
          <i class="ri-mail-line"></i>
          <input type="email" placeholder="Email Address" required>
        </div>
        <div class="field">
          <i class="ri-lock-line"></i>
          <input type="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="divider"><span>OR CONTINUE WITH</span></div>

      <div class="social">
        <button type="button" class="btn-social"><i class="ri-google-fill google"></i> Google</button>
        <button type="button" class="btn-social"><i class="ri-github-fill"></i> GitHub</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
